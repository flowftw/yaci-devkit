apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cardano-node
  namespace: default
  labels:
    app: cardano-node
spec:
  serviceName: cardano-node
  replicas: 1
  selector:
    matchLabels:
      app: cardano-node
  template:
    metadata:
      labels:
        app: cardano-node
    spec:
      containers:
      - name: cardano-node
        image: blinklabs/cardano-node:10.5.1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3001
          name: node-port
        - containerPort: 12788
          name: prometheus
        env:
        - name: NETWORK
          value: "mainnet"
        volumeMounts:
        - name: node-data
          mountPath: /data
        - name: node-ipc
          mountPath: /ipc
      volumes:
      - name: node-ipc
        emptyDir: {}
  volumeClaimTemplates:
  - metadata:
      name: node-data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
