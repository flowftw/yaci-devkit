{{- if .Values.rbac.create }}
{{- if .Values.rbac.clusterWide }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "yaci-operator.fullname" . }}
  labels:
    {{- include "yaci-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "yaci-operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "yaci-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- else }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "yaci-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "yaci-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "yaci-operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "yaci-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
