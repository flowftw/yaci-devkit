  # CardanoNode status subresource
  - apiGroups:
      - com.bloxbean
    resources:
      - cardanonodes/status
    verbs:
      - get
      - update
      - patch
  # Workloads
  - apiGroups:
      - apps
    resources:
      - statefulsets
      - deployments
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  # Core resources
  - apiGroups:
      - ""
    resources:
      - services
      - configmaps
      - secrets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  # Pods (read-only — for status inspection)
  - apiGroups:
      - ""
    resources:
      - pods
