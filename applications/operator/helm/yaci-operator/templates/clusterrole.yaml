{{- if .Values.rbac.create }}
{{- if .Values.rbac.clusterWide }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "yaci-operator.fullname" . }}
  labels:
    {{- include "yaci-operator.labels" . | nindent 4 }}
rules:
  # CustomResource: CardanoNode
  - apiGroups:
      - com.bloxbean
    resources:
      - cardanonodes
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  # CardanoNode status subresource
  - apiGroups:
      - com.bloxbean
    resources:
      - cardanonodes/status
    verbs:
      - get
      - update
      - patch
  # Workloads
  - apiGroups:
      - apps
    resources:
      - statefulsets
      - deployments
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  # Core resources
  - apiGroups:
      - ""
    resources:
      - services
      - configmaps
      - secrets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  # Pods (read-only — for status inspection)
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
  # Events (for recording reconcile events)
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
  # Leader election leases
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
{{- else }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
