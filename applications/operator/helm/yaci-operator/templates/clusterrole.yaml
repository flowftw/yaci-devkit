  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "yaci-operator.labels" . | nindent 4 }}
rules:
  # CustomResource: CardanoNode
  - apiGroups:
      - com.bloxbean
    resources:
      - cardanonodes
    verbs:
      - get
      - list
