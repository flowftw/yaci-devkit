/*
 * This file was generated by the Gradle 'init' task.
 */

plugins {
    id 'buildlogic.java-application-conventions'
}

dependencies {
    implementation("io.javaoperatorsdk:operator-framework-spring-boot-starter:6.1.2")
    compileOnly("org.projectlombok:lombok:1.18.42")
    annotationProcessor("org.projectlombok:lombok:1.18.42")
    implementation("com.samskivert:jmustache:1.16")
    implementation("com.bloxbean.cardano:genesis-config")

    // Fabric8 annotation processor that generates CRDs from CustomResource classes
    annotationProcessor("io.fabric8:crd-generator-apt:7.3.1")
}

// Generate CRD manifests from annotated CustomResource classes
tasks.register('generateCrd', Copy) {
    dependsOn tasks.named('classes')
    from(layout.buildDirectory.dir('classes/java/main/META-INF/fabric8'))
    include('*.yml', '*.yaml', '*.json')
    into(layout.projectDirectory.dir('k8s/crd'))
}

application {
    // Define the main class for the application.
    mainClass = 'com.bloxbean.cardano.operator.app.App'
}
