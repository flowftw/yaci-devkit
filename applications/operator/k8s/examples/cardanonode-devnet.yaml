apiVersion: com.bloxbean/v1
kind: CardanoNode
metadata:
  name: cardano-node-devnet
  namespace: default
spec:
  # Devnet mode keeps cardano-node image, but switches to devnet command/config mounts
  network: devnet

  # Optional (default: blinklabs/cardano-node:main)
  image: blinklabs/cardano-node:10.5.1

  replicas: 1

  # Optional override names. If omitted, operator auto-generates:
  # <name>-devnet-config and <name>-devnet-keys
  # devnetConfigMap: cardano-node-devnet-config
  # devnetKeysSecret: cardano-node-devnet-keys

  # --- Yaci Store & Store UI ---
  # Enable to deploy yaci-store and yaci-viewer (UI) alongside the devnet node.
  # Requires network=devnet.
  yaciStoreEnabled: true

  # Optional: override default images
  # yaciStoreImage: bloxbean/yaci-cli:latest
  # yaciStoreUiImage: bloxbean/yaci-viewer:latest

  # Optional: persistent storage for the store database (default: 10Gi)
  # yaciStoreStorage: 10Gi
